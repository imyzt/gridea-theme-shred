<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/layout.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/article.css">
<link rel="stylesheet" href="/styles/pages.css">
<link rel="stylesheet" href="/styles/comments.css">
<link rel="stylesheet" href="/styles/utilities.css">
<link rel="stylesheet" href="/styles/responsive.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<link rel="icon" href="/favicon.ico" type="image/x-icon">

{% if theme_config.heatmapColor or theme_config.accentColor %}
<style>
  :root {
    {% if theme_config.heatmapColor %}--heatmap-color: {{ theme_config.heatmapColor }};{% endif %}
    {% if theme_config.accentColor %}--color-accent: {{ theme_config.accentColor }}; --color-accent-hover: {{ theme_config.accentColor }};{% endif %}
  }
</style>
{% endif %}

<style>
  /* 防止动效选择器错误导致内容不可见（shred-motion 在 body 上） */
  body.shred-motion [data-shred-item].is-in {
    opacity: 1 !important;
    transform: none !important;
  }
</style>

<style>
  .theme-toggle-sun  { display: none; }
  .theme-toggle-moon { display: flex; }
  :root.theme-dark .theme-toggle-sun  { display: flex; }
  :root.theme-dark .theme-toggle-moon { display: none; }
</style>

<script>
  (function () {
    try {
      var saved = localStorage.getItem('shred-theme');
      var theme = saved || '{{ theme_config.defaultTheme|default:"light" }}';
      if (theme === 'dark') {
        document.documentElement.classList.add('theme-dark');
      } else {
        document.documentElement.classList.add('theme-light');
      }
    } catch (e) {
      document.documentElement.classList.add('theme-light');
    }
  })();
</script>
